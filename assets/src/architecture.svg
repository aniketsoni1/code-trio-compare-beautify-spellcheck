<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
    <defs>
      <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
        <path d="M0,0 L9,4.5 L0,9 z" fill="#233049"/>
      </marker>
    </defs>
    <rect width="1200" height="720" fill="#0B1020"/>
    <text x="40" y="50" font-family="Poppins, Lato, DejaVu Sans, sans-serif" font-weight="700" font-size="26" fill="#E7ECF5">Code Trio architecture</text>
    <text x="40" y="78" font-family="Poppins, Lato, DejaVu Sans, sans-serif" font-size="15" fill="#8A93A6">Pure engines over one shared model; @ctr/agent is the only I/O seam; two thin apps.</text>

    
    <g transform="translate(120,120)">
      <rect width="200" height="70" rx="10" fill="#121A2E" stroke="#4C8DFF" stroke-width="1.5"/>
      <text x="100" y="26" text-anchor="middle" font-family="Poppins, Lato, DejaVu Sans, sans-serif" font-weight="600" font-size="15" fill="#E7ECF5">CLI (code-trio)</text>
      <text x="100" y="48" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="11" fill="#8A93A6">commander</text>
    </g>
    
    <g transform="translate(880,120)">
      <rect width="200" height="70" rx="10" fill="#121A2E" stroke="#B57BFF" stroke-width="1.5"/>
      <text x="100" y="26" text-anchor="middle" font-family="Poppins, Lato, DejaVu Sans, sans-serif" font-weight="600" font-size="15" fill="#E7ECF5">VS Code extension</text>
      <text x="100" y="48" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="11" fill="#8A93A6">lazy activation</text>
    </g>
    
    <g transform="translate(430,130)">
      <rect width="340" height="60" rx="10" fill="#121A2E" stroke="#37D39B" stroke-width="1.5"/>
      <text x="170" y="26" text-anchor="middle" font-family="Poppins, Lato, DejaVu Sans, sans-serif" font-weight="600" font-size="15" fill="#E7ECF5">@ctr/agent</text>
      <text x="170" y="48" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="11" fill="#8A93A6">orchestration + I/O (fs, git, dict)</text>
    </g>

    <line x1="320" y1="155" x2="430" y2="158" stroke="#233049" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="880" y1="155" x2="770" y2="158" stroke="#233049" stroke-width="1.5" marker-end="url(#arr)"/>

    
    <g transform="translate(120,300)">
      <rect width="260" height="70" rx="10" fill="#121A2E" stroke="#4C8DFF" stroke-width="1.5"/>
      <text x="130" y="26" text-anchor="middle" font-family="Poppins, Lato, DejaVu Sans, sans-serif" font-weight="600" font-size="15" fill="#E7ECF5">@ctr/diff-engine</text>
      <text x="130" y="48" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="11" fill="#8A93A6">Myers + 3-way merge</text>
    </g>
    
    <g transform="translate(470,300)">
      <rect width="260" height="70" rx="10" fill="#121A2E" stroke="#37D39B" stroke-width="1.5"/>
      <text x="130" y="26" text-anchor="middle" font-family="Poppins, Lato, DejaVu Sans, sans-serif" font-weight="600" font-size="15" fill="#E7ECF5">@ctr/spell-engine</text>
      <text x="130" y="48" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="11" fill="#8A93A6">tokenize + split + suggest</text>
    </g>
    
    <g transform="translate(820,300)">
      <rect width="260" height="70" rx="10" fill="#121A2E" stroke="#B57BFF" stroke-width="1.5"/>
      <text x="130" y="26" text-anchor="middle" font-family="Poppins, Lato, DejaVu Sans, sans-serif" font-weight="600" font-size="15" fill="#E7ECF5">@ctr/format-engine</text>
      <text x="130" y="48" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="11" fill="#8A93A6">adapter registry</text>
    </g>

    <line x1="470" y1="200" x2="250" y2="300" stroke="#233049" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="600" y1="200" x2="600" y2="300" stroke="#233049" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="720" y1="200" x2="950" y2="300" stroke="#233049" stroke-width="1.5" marker-end="url(#arr)"/>

    
    <g transform="translate(820,430)">
      <rect width="260" height="60" rx="10" fill="#121A2E" stroke="#B57BFF" stroke-width="1.5"/>
      <text x="130" y="26" text-anchor="middle" font-family="Poppins, Lato, DejaVu Sans, sans-serif" font-weight="600" font-size="15" fill="#E7ECF5">@ctr/formatters</text>
      <text x="130" y="48" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="11" fill="#8A93A6">Prettier standalone adapter</text>
    </g>
    <line x1="950" y1="370" x2="950" y2="430" stroke="#233049" stroke-width="1.5" marker-end="url(#arr)"/>
    
    <g transform="translate(470,430)">
      <rect width="260" height="60" rx="10" fill="#121A2E" stroke="#37D39B" stroke-width="1.5"/>
      <text x="130" y="26" text-anchor="middle" font-family="Poppins, Lato, DejaVu Sans, sans-serif" font-weight="600" font-size="15" fill="#E7ECF5">@ctr/dictionaries</text>
      <text x="130" y="48" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="11" fill="#8A93A6">CC0 base + technical lists</text>
    </g>
    <line x1="600" y1="370" x2="600" y2="430" stroke="#233049" stroke-width="1.5" marker-end="url(#arr)"/>

    
    <g transform="translate(360,560)">
      <rect width="480" height="80" rx="10" fill="#121A2E" stroke="#E7ECF5" stroke-width="1.5"/>
      <text x="240" y="26" text-anchor="middle" font-family="Poppins, Lato, DejaVu Sans, sans-serif" font-weight="600" font-size="15" fill="#E7ECF5">@ctr/core</text>
      <text x="240" y="48" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="11" fill="#8A93A6">Document · Token · Diagnostic · DiffHunk · FormatResult · Zod · LanguageId · ToolDescriptor</text>
    </g>
    <line x1="250" y1="370" x2="470" y2="560" stroke="#233049" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="600" y1="490" x2="600" y2="560" stroke="#233049" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="950" y1="490" x2="720" y2="560" stroke="#233049" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="40" y="696" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#8A93A6">engines are pure: no vscode imports, no file I/O, no network</text>
  </svg>