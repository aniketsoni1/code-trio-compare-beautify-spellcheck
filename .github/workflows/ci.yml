name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
      - name: Build bundles
        run: npm run build
      - name: Package VSIX
        run: npm run package:vsix
      - name: Audit VSIX contents
        run: npm run verify:vsix
      - name: Upload VSIX artifact
        if: matrix.node == 20
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: artifacts/*.vsix
          if-no-files-found: error

  e2e:
    name: extension integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build extension
        run: npm run build:ext
      - name: Run VS Code integration tests (headless)
        run: xvfb-run -a npm run test:ext
