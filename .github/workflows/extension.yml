name: Extension

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package and verify VSIX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run package:vsix
      - run: npm run verify:vsix
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: artifacts/*.vsix
          if-no-files-found: error

  publish-marketplace:
    name: Publish to VS Code Marketplace (guarded)
    needs: package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:ext
      - name: Publish to Marketplace (only when VSCE_PAT is configured)
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        working-directory: apps/vscode-extension
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "VSCE_PAT not set - skipping Marketplace publish."
            exit 0
          fi
          npx --yes @vscode/vsce publish --pat "$VSCE_PAT" --no-dependencies

  publish-openvsx:
    name: Publish to Open VSX (guarded)
    needs: package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:ext
      - run: npm run package:vsix
      - name: Publish to Open VSX (only when OVSX_PAT is configured)
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "OVSX_PAT not set - skipping Open VSX publish."
            exit 0
          fi
          npx --yes ovsx publish artifacts/*.vsix --pat "$OVSX_PAT"
