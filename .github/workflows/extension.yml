name: Extension

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package and verify VSIX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run package:vsix
      - run: npm run verify:vsix
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: artifacts/*.vsix
          if-no-files-found: error

  publish-marketplace:
    name: Publish to VS Code Marketplace (guarded)
    needs: package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      # Required for Entra ID workload identity federation (OIDC).
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:ext

      # ────────────────────────────────────────────────────────────────
      # Authentication mode.
      #
      # Global Azure DevOps Personal Access Tokens are retired on
      # 1 December 2026, after which PAT-based publishing stops working:
      # https://devblogs.microsoft.com/devops/retirement-of-global-personal-access-tokens-in-azure-devops/
      #
      # Preferred:  Entra ID workload identity federation (no stored secret).
      #             Set AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID.
      # Fallback:   VSCE_PAT, until the retirement date.
      # ────────────────────────────────────────────────────────────────
      - name: Determine publish credentials
        id: auth
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -n "$AZURE_CLIENT_ID" ]; then
            echo "mode=entra" >> "$GITHUB_OUTPUT"
            echo "Publishing with Entra ID workload identity federation."
          elif [ -n "$VSCE_PAT" ]; then
            echo "mode=pat" >> "$GITHUB_OUTPUT"
            echo "::warning::Publishing with a Personal Access Token. Global Azure DevOps PATs retire on 2026-12-01 - migrate to Entra ID before then."
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "No publish credentials configured - skipping Marketplace publish."
          fi

      - name: Azure login (workload identity federation)
        if: steps.auth.outputs.mode == 'entra'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Publish to Marketplace (Entra ID)
        if: steps.auth.outputs.mode == 'entra'
        working-directory: apps/vscode-extension
        run: npx --yes @vscode/vsce publish --azure-credential --no-dependencies

      - name: Publish to Marketplace (PAT - deprecated)
        if: steps.auth.outputs.mode == 'pat'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        working-directory: apps/vscode-extension
        run: npx --yes @vscode/vsce publish --pat "$VSCE_PAT" --no-dependencies

  publish-openvsx:
    name: Publish to Open VSX (guarded)
    needs: package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:ext
      - run: npm run package:vsix
      - name: Publish to Open VSX (only when OVSX_PAT is configured)
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "OVSX_PAT not set - skipping Open VSX publish."
            exit 0
          fi
          npx --yes ovsx publish artifacts/*.vsix --pat "$OVSX_PAT"
