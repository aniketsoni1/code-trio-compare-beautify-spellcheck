name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build and verify release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Quality gate
        run: npm run verify
      - name: Build bundles
        run: npm run build
      - name: Package VSIX
        run: npm run package:vsix
      - name: Audit VSIX
        run: npm run verify:vsix
      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum *.vsix > checksums.sha256
          cat checksums.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            artifacts/*.vsix
            artifacts/checksums.sha256
          if-no-files-found: error

  github-release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: artifacts
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.vsix
            artifacts/checksums.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true

  publish-npm:
    name: Publish CLI to npm (guarded)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
          cache: npm
      - run: npm ci
      - name: Build CLI
        run: npm run build:cli
      - name: Publish (only when NPM_TOKEN is configured)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN not set - skipping npm publish."
            exit 0
          fi
          npm publish --workspace code-trio --access public --provenance

  publish-ghcr:
    name: Publish CLI image to GHCR (guarded)
    needs: build
    runs-on: ubuntu-latest
    if: ${{ vars.PUBLISH_GHCR == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci && npm run build:cli
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/aniketsoni1/code-trio:latest
            ghcr.io/aniketsoni1/code-trio:${{ github.ref_name }}
